- summary: |
    Все страницы открываются только по HTTPS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыт браузер Chrome
  test-data: |
    URL - https://products-store.hexlet.app/
    Товар "Dog Food"
  steps:
    - Переходим по URL на главную страниц
    - Открываем страницу товара Dog Food
    - Добавялем товар в корзину
    - Открываем корзину
  expected-result: |
    URL каждой страницы начинается с https://

- summary: |
    Перенаправление с HTTP на HTTPS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыт браузер Chrome
  test-data: |
    URL - http://products-store.hexlet.app/
    URL товара "Dog Food" - http://products-store.hexlet.app/products/22
  steps:
    - Вводим в адресную строку URL главной страницы с http://
    - Вводим в адресную строку URL страницы товара с http://
  expected-result: |
    Браузер перенаправлен обе страницы на тот же адрес с https://
    Открывается та же страница - главная и страница товара "Dog Food"

- summary: |
    Проверка SSL-сертификата сайта
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыт браузер Chrome
    Открыта главная страница сайта по HTTPS
  test-data: |
    -
  steps:
    - Нажимать на значок слева от адреса в адресной строке
    - Переходим в раздел "Подключение защищено"
    - Открываем раздел "Действительный сертификат"
  expected-result: |
    Браузер не показывает предупреждений о небезопасном соединении
    Сертификат выдан на домен магазина
    Срок действия сертификата не истёк

- summary: |
    Проверка сайта на XSS уязвимости
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыта главная страница сайта
  test-data: |
    XSS запрос - <scritp>alert("Privet")</script>
  steps:
    - Вводим запрос в строку поиска товаров
  expected-result: |
    Всплывающее окно с текстом "Privet" не появляется
    Введённое значение отображается как обычный текст
    Выводится сообщение в каталоге товаров "Ничего не найдено!"

- summary: |
    Просмотре корзины в другой ссесии с другого браузера
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Сайт открыт в Chrome
    В корзину добавлен 1 товар "Dog Food"
  test-data: |
    Dog Food, цена 9.86$, количество 1
  steps:
    - Открываем корзину в Chrome и копируем URL страницы
    - Открываем скопированный URL в браузере Firefox
  expected-result: |
    В Firefox корзина пуста, товар "Dog Food" не отображается
    В Chrome в корзине отображается това "Dog Food"

- summary: |
    Время загрузки сайта на мобильном интернете
  requirement: |
    Сайт должен загружаться не дольше 3 секунд на мобильном интернете (3G)
  prerequisites: |
    Открыт Chrome, режим инкогнито
    Открыты DevTools (F12), вкладка Network, включена имитация сети "3G"
  test-data: |
    URL = https://products-store.hexlet.app/
  steps:
    - Переходим по URL
    - Дожидаемся полной загрузки страницы
    - Смотрим значение Load в нижней строке вкладки Network
  expected-result: |
    Значение Load не больше 3 секунд
    Карточки товаров с изображениями, названиями и ценами отображаются полностью

- summary: |
    Оценка производительности через Lighthouse
  requirement: |
    Оценка Performance в Google Lighthouse не ниже 90 (мобильная версия)
  prerequisites: |
    Открыт Chrome, режим инкогнито
    Открыта главная страница сайта
  test-data: |
    Mode - Navifation
    Device - Mobile
    Categories - Performance
  steps:
    - Открываем DevTools (F12), вкладка Lighthouse
    - Выбираем Mode - Navifation, Device - Mobile, Categories - Performance
    - Нажимаем "Analyze page load"
  expected-result: |
    Оценка Performance не ниже 90

