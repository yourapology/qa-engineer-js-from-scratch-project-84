- summary: |
    Отображение каталога товаров
  requirement: |
    Пользователь должен иметь возможность просматривать товары
  prerequisites: |
    Открыта главная страница сайта, каталог товаров загружен
    Фильтры не применены
  test-data: |
    Главная страница
    Карточки товаров с фотографией, наименованием, описанием, ценной
  steps:
    - Открыть главную страницу сайта
    - Прокрутить страницу вниз
  expected-result: |
    Пользователю должены отобразится карточки товаров
    Текст в карточке товара должен быть читабельным 
    В карточке товаров должно присуствовать: фотография товара, название, описани, цена, колличество товара, кнопка "В корзину"

- summary: |
    Просмотр карточки товара
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница сайта, каталог товаров загружен
    Фильтры не применены
  test-data: |
    Главная страница
    Карточки товаров с наименованием, описанием, ценной
  steps:
    - Открыть главную страницу сайта
    - Кликнуть на вторую карточку в каталоге
  expected-result: |
    Пользователь попадает в карточку товара
    В карточке товара отображаются фотокарточки товара, категория, название товара, рейтинг, цена, цена со скидкой(если имеется), колличество товара, кнопки "В корзину" и описание товара

- summary: |
    Успешное добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товар в корзину
  prerequisites: |
    Открыта главная страница сайта, каталог товаров загружен
    Фильтры не применены
    Корзина пустая
  test-data: |
    Dog Food, цена 9.86$
  steps:
    - Находим в каталоге карточку товара Dog Food
    - Нажимаем на карточке товара "В корзину"
  expected-result: |
    Товар добавлен в корзину
    В шапке сайта у раздела "Корзина" появляетс счетчик с цифрой 1

- summary: |
    Просмотр содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    Открыта главная страница сайта, каталог товаров загружен
    В корзине добавлен 1 товар "Dog Food"
  test-data: |
    Dog Food, цена 9.86$, колличество 1
  steps:
    - Нажать "Корзина" в меню шапки сайта
  expected-result: |
    Пользователь попадает в корзину
    В корзине лежит 1 товар "Dog Food"
    Указанна сумма содержимого в корзине - 9.86$

- summary: |
    Успешное удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалять товары из корзины
  prerequisites: |
    Открыта корзина
    В корзине добавлен 1 товар "Dog Food"
    В корзине добавлен 1 товар "Cat Food"
  test-data: |
    Dog Food, цена 9.86$, колличество 1
    Cat Food, цена 8.13$, колличество 1
    Общая сумма содержимого корзины 17.99$
  steps:
    - Нажать кнопку "Удалить" рядом с позицией Cat Food
  expected-result: |
    Товар пропадает из корзины
    В корзине остается 1 товар "Dog Food"
    Общая сумма содержимого в корзине меняется - 9.86$

- summary: |
    Успешное оформление заказа
  requirement: |
    Пользователь должен иметь возможность заказать товар из корзины
  prerequisites: |
    Открыта корзина
    В корзине добавлен 1 товар "Dog Food"
  test-data: |
    Dog Food, цена 9.86$, количество 1
  steps:
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Пользователя перенаправляет на страницу оплаты заказа.
    На странице указан товар "Dog Food", количество 1.
    Сумма к оплате = 9.86$

