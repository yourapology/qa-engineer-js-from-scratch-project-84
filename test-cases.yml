    Каталог товаров загружен
    Открыты DevTools (F12), вкладка Network, включена имитация сети "3G"
  test-data: |
    Ключевое слово - Food
  steps:
    - Вводим в строку поиска слово Food
  expected-result: |
    Страница не перезагружалась
