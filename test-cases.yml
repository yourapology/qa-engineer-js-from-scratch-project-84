  test-data: |
    Ключевое слово - Food
  steps:
    - Вводим в строку поиска слово Food
  expected-result: |
    Страница не перезагружалась
    Список найденных товаров отображается не позже чем через 1 секунду после ввода

- summary: |
    Перехода из каталога на страницу товара
  requirement: |
    При переходе из каталога на страницу товара, страницы не должна перезагружаться
  prerequisites: |
    Открыт Chrome, режим инкогнито
    Открыты DevTools (F12), вкладка Network, включены "Preserve log" и фильтр "Doc"
  test-data: |
    Открыта главная страницы сайта
    Товар - Dog Food
  steps:
    - Очищаем список запросов во вкладке Network
    - Нажимаем на карточку товара "Dog Food"
    - Дожидаемся отображения страницы товара
  expected-result: |
    Страница не перезагружалась
    В Network с фильтром "Doc" не появилось новых запросов.
    Открылась страница товара "Dog Food".
    URL изменился на адрес страницы товара - https://products-store.hexlet.app/products/22

- summary: |
    Отсутствие горизонтальной прокрутки на мобильном экране
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Открыт Chrome
    Открыт DevTools включён режим эмуляции устройства (Ctrl+Shift+M)
  test-data: |
    Устройство = iPhone SE (375 × 667)
    Страницы: каталог, страница товара Dog Food, корзина
  steps:
    - Открываем главную страницу сайта
    - Пробуем прокрутить страницу по горизонтали
    - Повторяем на странице товара "Dog Food"
    - Повторяем на странице Корзина
  expected-result: |
    На всех страницах горизонтальной прокрутки нет.
    Карточки, изображения и кнопки не обрезаются и не выходят за край экрана

- summary: |
    Поворот экрана смартфона
  requirement: |
