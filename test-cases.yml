- summary: |
    Сайт выдерживает 500 одновременных пользователей
  requirement: |
    Сайт выдерживает 500 одновременных пользователей (95% запросов выполняются не дольше 2 с, доля ошибок не выше 1%)
  prerequisites: |
    ОС Windows 11, 26H2, сборка ОС 26300.9711
    Java 27.0.1
    Apache JMeter 5.6.3 распакован в папку apache-jmeter-5.6.3 где лежит план load-test.jmx (HTTP-реализация Java, HTTP Cache Manager, пауза 1–3 с между запросами)
    Создана папка QA\logs
    В файле apache-jmeter-5.6.3\bin\log4j2.xml нет строк после </Configuration> (иначе JMeter не пишет jmeter.log)
  test-data: |
    Пользователей (потоков) = 500; разгон = 120 с; длительность = 720 с (2 мин разгон + 10 мин удержание)
    Сценарий пользователя по кругу = GET /, /assets/index-Dk_u7iDH.js, /assets/index-CWqyei10.css, /api/products?skip=0, /api/products?skip=30, /products/1, /api/products/1, /cart
    Команда для запуска - java -jar .\apache-jmeter-5.6.3\bin\ApacheJMeter.jar -n -t load-test.jmx -Jthreads=500 -Jrampup=120 -Jduration=720 -Jsummariser.interval=30 -l logs\results-500-users.jtl -j logs\jmeter-500-users.log -e -o logs\report-500-users
  steps:
    - Открываем терминал в окружении папки с файлом load-test.jmx
    - Запускаем команду из тестовых данных и сохраняем вывод консоли в logs\console-500-users.txt
    - Во время теста следим за строками «summary +» каждые 30 с (колонки Avg, Max, Err)
    - Дожидаемся строки «... end of run» и генерации отчёта (около 13 мин)
    - Открываем logs\report-500-users\index.html
    - В таблице Statistics в строке Total смотрим «95th pct» и «Error %»
    - В блоке Errors смотрим типы ошибок
    - На вкладке Charts - Over Time - Response Times Over Time смотрим, как менялось время ответа
  expected-result: |
    95th pct в строке Total не больше 2000 мс (не меньше 95% запросов выполняются не дольше 2 с)
    Error % в строке Total не больше 1%

