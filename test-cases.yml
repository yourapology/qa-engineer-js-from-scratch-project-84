- summary: |
    Успешный поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница сайта, каталог товаров загружен
  test-data: |
    Ключевое слово - Watch
  steps:
    - Вводим в строку поиска слово Watch
