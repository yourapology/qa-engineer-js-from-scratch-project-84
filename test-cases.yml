- summary: |
    Отображение каталога товаров
  requirement: |
    Пользователь должен иметь возможность просматривать товары
  prerequisites: |
    Открыта главная страница сайта, каталог товаров загружен
    Фильтры не применены
  test-data: |
    Главная страница
    Карточки товаров с фотографией, наименованием, описанием, ценной
  steps:
    - Открыть главную страницу сайта
    - Прокрутить страницу вниз
  expected-result: |
    Пользователю должены отобразится карточки товаров
    Текст в карточке товара должен быть читабельным 
    В карточке товаров должно присуствовать: фотография товара, название, описани, цена, колличество товара, кнопка "В корзину"

- summary: |
    Просмотр карточки товара
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница сайта, каталог товаров загружен
    Фильтры не применены
  test-data: |
    Главная страница
    Карточки товаров с наименованием, описанием, ценной
  steps:
    - Открыть главную страницу сайта
    - Кликнуть на вторую карточку в каталоге
  expected-result: |
    Пользователь попадает в карточку товара
    В карточке товара отображаются фотокарточки товара, категория, название товара, рейтинг, цена, цена со скидкой(если имеется), колличество товара, кнопки "В корзину" и описание товара

