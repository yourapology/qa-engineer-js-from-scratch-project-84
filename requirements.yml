---
functional:
  - Пользователь может просматривать каталог товаров
  - Пользователь может переходить между страницами каталога с помощью пагинации
  - В карточке товара в каталоге выводятся изображение, название, рейтинг, описание и цена
  - Для товара со скидкой в карточке в каталоге выводятся цена без скидки и цена со скидкой
  - Пользователь может открыть страницу товара из каталога
  - На странице товара выводятся изображение, название, рейтинг, описание и цена
  - Для товара со скидкой на странице товара выводятся цена без скидки и цена со скидкой
  - Пользователь может искать товары по ключевому слову
  - Пользователь может выбрать категорию и увидеть только товары этой категории
  - Пользователь может фильтровать товары по бренду
  - Пользователь может фильтровать товары по наличию
  - Пользователь может добавить товар в корзину из каталога
  - Пользователь может добавить товар в корзину со страницы товара
  - После добавления товара в корзину пользователь остаётся на текущей странице
  - Пользователь может просматривать содержимое корзины
  - Пользователь может удалить товар из корзины
  - Пользователь может вернуться из корзины в каталог по кнопке Продолжить покупки
  - Содержимое корзины сохраняется после перезагрузки страницы
  - Пользователь может оформить заказ из корзины, после чего открывается страница оплаты
  - Пользователь может переключить язык интерфейса между русским и английским
  - Все элементы интерфейса (меню, кнопки) переведены на русский язык
  - Все элементы интерфейса (меню, кнопки) переведены на английский язык
  - Описания товаров отображаются на выбранном языке интерфейса

non-functional:
  - Переход из каталога на страницу товара выполняется без перезагрузки страницы
  - Переход в корзину выполняется без перезагрузки страницы
  - Переход из корзины в каталог по кнопке Продолжить покупки выполняется без перезагрузки страницы
  - Поиск товаров выполняется без перезагрузки страницы
  - Фильтрация товаров выполняется без перезагрузки страницы
  - Переход между страницами каталога выполняется без перезагрузки страницы
  - Главная страница загружается не дольше 3 с при эмуляции 3G (метрика Load)
  - Оценка Performance в Lighthouse для главной страницы не ниже 90 (режим Mobile)
  - Результаты поиска отображаются не позже чем через 1 с после окончания ввода
  - При просмотре каталога в консоли браузера нет ошибок JavaScript
  - При поиске товаров в консоли браузера нет ошибок JavaScript
  - При фильтрации товаров в консоли браузера нет ошибок JavaScript
  - При работе с корзиной в консоли браузера нет ошибок JavaScript
  - При оформлении заказа в консоли браузера нет ошибок JavaScript
  - При просмотре каталога запросы не возвращают ответы с кодами 4xx и 5xx
  - При поиске товаров запросы не возвращают ответы с кодами 4xx и 5xx
  - При фильтрации товаров запросы не возвращают ответы с кодами 4xx и 5xx
  - При работе с корзиной запросы не возвращают ответы с кодами 4xx и 5xx
  - При оформлении заказа запросы не возвращают ответы с кодами 4xx и 5xx
  - Сайт выдерживает 500 одновременных пользователей (95% запросов выполняются не дольше 2 с, доля ошибок не выше 1%)
  - Сайт открывается по протоколу HTTPS
  - Запрос к сайту по HTTP перенаправляется на HTTPS
  - HTML и JavaScript, введённые в поле поиска, не исполняются
  - Вёрстка отображается без горизонтальной прокрутки при ширине экрана от 375 до 1920 px
  - Элементы страницы не перекрывают друг друга при ширине экрана от 375 до 1920 px
  - При повороте экрана смартфона вёрстка перестраивается без горизонтальной прокрутки
  - При повороте экрана смартфона элементы страницы не перекрывают друг друга
  - В последней стабильной версии Chrome выполняются все основные сценарии (просмотр каталога, поиск, фильтрация, корзина, оформление заказа)
  - В последней стабильной версии Firefox выполняются все основные сценарии (просмотр каталога, поиск, фильтрация, корзина, оформление заказа)
  - Сайт открывается из сети Интернет в РФ без использования VPN

implicit:
  - Поиск применяется автоматически по мере ввода, без нажатия Enter
  - Поиск не зависит от регистра
  - Поиск выполняется по всему каталогу
  - При отсутствии результатов поиска показывается сообщение о пустой выдаче
  - Есть кнопка сброса всех применённых фильтров
  - Фильтры сохраняются при возврате в каталог со страницы товара по кнопке Назад в браузере
  - Номер страницы сохраняется при возврате в каталог со страницы товара по кнопке Назад в браузере
  - Фильтры сохраняются при возврате в каталог из корзины по кнопке Назад в браузере
  - Номер страницы сохраняется при возврате в каталог из корзины по кнопке Назад в браузере
  - Фильтры сохраняются при возврате в каталог из корзины по кнопке Продолжить покупки
  - Номер страницы сохраняется при возврате в каталог из корзины по кнопке Продолжить покупки
  - Для товара со скидкой цена со скидкой меньше цены без скидки
  - Пользователь получает уведомление после добавления товара в корзину
  - Счётчик на иконке корзины показывает количество товаров в корзине
  - Итоговая сумма в корзине равна сумме цен товаров с учётом скидки
  - В пустой корзине показывается сообщение о том, что корзина пуста
  - Оформить заказ с пустой корзиной нельзя
  - Выбранный язык сохраняется после перезагрузки страницы
