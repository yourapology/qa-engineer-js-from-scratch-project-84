bugreports:
  - summary: |
      Кнопка «Следующая» пропадает, если на странице меньше 30 товаров, каталог обрывается на 4 странице, страницы 5–7 недоступны
    environment: |
      Google Chrome 155.0.8059.80 (Официальная сборка) (64 бит)
      ОС Windows 11, 26H2, сборка ОС 26300.9711
    steps-to-reproduce: |
      1. Открыть https://products-store-v2.hexlet.app/
      2. Выбрать русский язык
      3. Нажать «Следующая» 3 раза
      4. Посмотреть на кнопки пагинации
      5. Открыть https://products-store-v2.hexlet.app/ снова
      6. В списке «Категория» выбрать groceries
      7. Посмотреть на кнопки пагинации
      8. Открыть https://products-store-v2.hexlet.app/ снова
      9. Снять отметку с чекбокса «В наличии»
      10. Посмотреть на кнопки пагинации
      Ошибка обнаруживается на шаге 4
    expected-result: |
      На 4 странице есть кнопка «Следующая», каталог листается до 7 страницы
      При выборе groceries доступна следующая страница с остальными продуктами
      При снятом «В наличии» каталог листается кнопкой «Следующая» до 7 страницы
    actual-result: |
      На 4 странице 29 карточек и только кнопка «Предыдущая», страницы 5–7 недоступны, хотя во вкладке Network, при выборе запроса https://products-store-v2.hexlet.app/api/products?skip=0, вкладка Response возвращает 194 товара
      При выборе groceries 15 карточек и ни одной кнопки пагинации - остальные 12 продуктов недоступны
      При снятом «В наличии» кнопок пагинации нет, товары с остатком 0 на 4 странице (Sportbike Motorcycle) недоступны
      Судя по поведению, «Следующая» показывается только когда на странице ровно 30 карточек, а фильтр «В наличии» и категория уменьшают их число
      Новая ошибка, в версии 1 её не было
      Ошибка изображена на скриншотах Screenshot/пагинация 4 страница 29 товара.png, Screenshot/devtools пагинация.png

  - summary: |
      При поиске без результатов показывается весь каталог вместо сообщения «Ничего не найдено!»
    environment: |
      Google Chrome 155.0.8059.80 (Официальная сборка) (64 бит)
      ОС Windows 11, 26H2, сборка ОС 26300.9711
    steps-to-reproduce: |
      1. Открыть https://products-store-v2.hexlet.app/
      2. Выбрать русский язык
      3. Ввести в поле «Поиск» Faad
      Ошибка обнаруживается на шаге 3
    expected-result: |
      Карточки не отображаются, показывается сообщение «Ничего не найдено!»
    actual-result: |
      Сообщения нет, отображаются все 30 карточек первой страницы
      Та же ошибка на спец. символы
      Новая ошибка, в версии 1 её не было
      Ошибка изображена на скриншоте Screenshot/нет ошибки при поиске несущ.png

  - summary: |
      Заказ не оформляется — POST /api/orders отвечает 500, страница оплаты не открывается
    environment: |
      Google Chrome 155.0.8059.80 (Официальная сборка) (64 бит)
      Firefox 159.0 (64-разрядный)
      ОС Windows 11, 26H2, сборка ОС 26300.9711
    steps-to-reproduce: |
      1. Открыть https://products-store-v2.hexlet.app/
      2. Выбрать русский язык
      3. Нажать «Следующая»
      4. В карточке Milk нажать «В корзину»
      5. Нажать «Корзина» в шапке
      6. Открыть DevTools (F12), вкладку Console
      7. Нажать «Оформить заказ»
      Ошибка обнаруживается на шаге 7
    expected-result: |
      Заказ создаётся, открывается страница оплаты с суммой 3.01$
      В консоли нет ошибок, запросы не возвращают ответы 4xx и 5xx
    actual-result: |
      POST https://products-store-v2.hexlet.app/api/orders ошибка 500 {"message":"Failed to create order","statusCode":500}, заказ не создаётся
      Страница оплаты не открывается, пользователь остаётся на https://products-store-v2.hexlet.app/cart
      Chrome - в консоли POST https://products-store-v2.hexlet.app/api/orders 500 (Internal Server Error)
      Firefox - в консоли POST https://products-store-v2.hexlet.app/api/orders [HTTP/3 500  4ms]
      Ошибка воспроизводится и в версии 1 - в версии 2 не исправлена
      Ошибка изображена на скриншотах Screenshot/ошибка заказа chrome.png, Screenshot/ошибка заказа огнен.png

  - summary: |
      При ошибке оформления заказа показывается сообщение «Заказ успешно формлен»
    environment: |
      Google Chrome 155.0.8059.80 (Официальная сборка) (64 бит)
      Firefox 159.0 (64-разрядный)
      ОС Windows 11, 26H2, сборка ОС 26300.9711
    steps-to-reproduce: |
      1. Открыть https://products-store-v2.hexlet.app/
      2. Выбрать русский язык
      3. Нажать «Следующая»
      4. В карточке Milk нажать «В корзину»
      5. Нажать «Корзина» в шапке
      6. Открыть DevTools (F12), вкладку Network
      7. Нажать «Оформить заказ»
      Ошибка обнаруживается на шаге 7
    expected-result: |
      Если сервер вернул ошибку, пользователь видит сообщение о том, что заказ не оформлен, и может повторить попытку
    actual-result: |
      Сервер вернул 500 на POST /api/orders, но показывается окно «Заказ успешно формлен» со списком товаров и суммой
      Ошибка воспроизводится и в версии 1 - в версии 2 не исправлена
      Ошибка изображена на скриншоте Screenshot/ошибка при заказе_окно.png

