bugreports:
  - summary: |
      Некорректно работает фильтр по брендам
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. В фильтре категорий выбрать любую категорию
      3. В фильтре бренд выбрать любой бренд
      Ошибка возникает на шаге 3
    expected-result: |
      Отображается список товаров тех брендов, которые включены в эту категорию
      Если товаров выбранного бренда в категории нет, отображается "Список товаров пуст"
    actual-result: |
      Ранее примененный фильтр категорий перестает работать, отображается весь каталог

  - summary: |
      Некорректно работает фильтр "В наличии"
    environment: |
      https://products-store-v2.hexlet.app/
      Фильтр "В наличии" включен
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. В фильтре категорий выбрать любую категорию
      3. Выключить фильтр "В наличии"
      Ошибка возникает на шаге 3
    expected-result: |
      Отображается список всех товаров выбранной категории, в том числе не в наличии
    actual-result: |
      Показывает список абсолютно всех товаров, даже которые не относятся к выбранной категории

  - summary: |
      Время загрузки главной страницы на 3G превышает требование (15 с при норме 3 с)
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
      DevTools (F12), вкладка Network, включена имитация сети "3G"
    steps-to-reproduce: |
      1. Открыть Chrome, открыть DevTools - вкладка Network
      2. Включить в Throttling - 3G
      3. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      4. Дождаться полной загрузки и посмотреть значение Load внизу вкладки Network
      5. Повторить шаги 3-4 ещё 4 раза
      Ошибка обнаруживается на шаге 4
    expected-result: |
      Страница полностью загружается не более чем за 3 секунды
    actual-result: |
      Страница загружается за 15 секунд (среднее по 5 замерам)
      В версии 1 (https://products-store-ru.hexlet.app/) при тех же условиях - 7 секунд, во второй версии время загрузки выросло вдвое

  - summary: |
      Оценка Performance в Lighthouse (мобильная версия) ниже требования: 61 при норме не ниже 90
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
      Lighthouse: 13.4.1
      Режим: Mobile, категория Performance
    steps-to-reproduce: |
      1. Открыть главную страницу сайта в Chrome в режиме инкогнито
      2. Открыть DevTools - вкладка Lighthouse
      3. Выбрать категорию Performance и устройство
      4. Нажать «Analyze page load»
      5. Дождаться формирования отчёта
      Ошибка обнаруживается на шаге 5
    expected-result: |
      Оценка Performance не ниже 90
    actual-result: |
      Оценка Performance - 61
      Метрики, не прошедшие проверку: FCP - 4,3s, LCP - 4,7s, SI - 9,5s
      В версии 1 (https://products-store-ru.hexlet.app/) при тех же условиях - 70, во второй версии оценка снизилась

  - summary: |
      Переход по кнопке в меню шапки перезагружает страницу
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. Открыть DevTools, вкладка Network, включить "Keep log" и фильтр "Doc"
      3. Очистить список запросов во вкладке Network
      4. Нажать кнопку "Store" в меню шапки
      Ошибка возникает на шаге 4
    expected-result: |
      Открывается каталог, страница не перезагружается
      В Network с фильтром "Doc" не появилось новых запросов
    actual-result: |
      Страница полностью перезагружается: в Network с фильтром "Doc" появляется новый запрос документа
      При переходах по карточке товара, кнопке "Continue shopping" в корзине и кнопке "Назад" в браузере перезагрузки нет - проблема только в меню шапки

  - summary: |
      Выбранный русский язык сбрасывается на английский после перезагрузки страницы
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/ (по умолчанию язык English)
      2. Переключить язык сайта на русский
      3. Нажать кнопку "Магазин" в меню шапки
      Ошибка возникает на шаге 3
    expected-result: |
      Открывается нужный раздел, язык интерфейса остаётся русским
    actual-result: |
      Страница перезагружается, язык интерфейса возвращается на английский

  - summary: |
      Ошибка в консоли браузера при нажатии "Оформить заказ" в корзине
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
      Браузер: Firefox 158.0.1 (64-разрядный)
    steps-to-reproduce: |
      1. Открыть DevTools (F12) - вкладка Console
      2. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      3. Открыть страницу товара "Dog Food" и добавить его в корзину
      4. Открыть корзину и нажать "Оформить заказ"
      Ошибка возникает на шаге 4
    expected-result: |
      В консоли нет сообщений об ошибках
    actual-result: |
      В консоли появляется ошибка:
      Chrome: index-CVwywYTQ.js:68  POST https://products-store-v2.hexlet.app/api/orders 500 (Internal Server Error) @ index-CVwywYTQ.js:67
      Firefox: XHR POST https://products-store-v2.hexlet.app/api/orders [HTTP/2 500  81ms]
      Ошибка воспроизводится и в версии 1 (https://products-store-ru.hexlet.app/) - в версии 2 не исправлена

  - summary: |
      Пропадает пагинация каталога после снятия фильтра "В наличии"
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. Снять галочку с фильтра "В наличии"
      Ошибка возникает на шаге 2
    expected-result: |
      Отображаются все товары, включая отсутствующие в наличии
      Если товаров больше, чем помещается на одну страницу, отображается пагинация и можно перейти на следующие страницы каталога
    actual-result: |
      Отображается только первая страница каталога, кнопки пагинации пропадают - перейти на следующие страницы нельзя

  - summary: |
      Пропадает пагинация при поиске на первой странице каталога
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. Ввести в строку поиска "11111"
      Ошибка возникает на шаге 2
    expected-result: |
      Если результатов поиска больше, чем помещается на одну страницу, отображается пагинация с переходом на следующие страницы
    actual-result: |
      Кнопки пагинации пропадают полностью - перейти на следующие страницы результатов нельзя

  - summary: |
      При поиске на второй странице каталога отсутствует кнопка перехода на следующую страницу
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. Перейти на вторую страницу каталога
      3. Ввести в строку поиска "111"
      Ошибка возникает на шаге 3
    expected-result: |
      Если результатов поиска больше, чем помещается на одну страницу, отображаются кнопки перехода на предыдущую и следующую страницы
    actual-result: |
      Отображается только кнопка "Предыдущая" (возврат на предыдущую страницу), кнопки "Следующая" нет

  - summary: |
      Поиск выполняется только по текущей странице каталога, а не по всему каталогу
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. Вводим в строку поиска watch
      Ошибка возникает на шаге 2
    expected-result: |
      На первой странице результатов отображаются товары с "Watch" в названии
      Сообщение "Товары не найдены" не отображается
    actual-result: |
      Товар не найден, если товара нет на странице, в каталоге показываются все товары

  - summary: |
      Не появляется уведомление при добавлении товара в корзину из каталога
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть главную страницу сайта - https://products-store-v2.hexlet.app/
      2. Ввести в строку поиска "Dog Food"
      3. Нажать кнопку "В корзину" на карточке товара "Dog Food" (цена 9.86$)
      Ошибка возникает на шаге 3
    expected-result: |
      Появляется уведомление о добавлении товара в корзину с названием "Dog Food"
      Пользователь остаётся на странице каталога
    actual-result: |
      Товар добавляется в корзину - счётчик у раздела "Корзина" в шапке сайта увеличивается на 1
      Уведомление о добавлении товара не появляется

  - summary: |
      Не появляется уведомление при добавлении товара в корзину со страницы товара
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть страницу товара "Dog Food" - https://products-store-v2.hexlet.app/products/22
      2. Нажать кнопку "В корзину"
      Ошибка возникает на шаге 2
    expected-result: |
      Появляется уведомление о добавлении товара в корзину с названием "Dog Food"
      Пользователь остаётся на странице товара
    actual-result: |
      Товар добавляется в корзину - счётчик у раздела "Корзина" в шапке сайта увеличивается на 1
      Уведомление о добавлении товара не появляется

  - summary: |
      Не работает сброс примененных фильтров
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть каталог товаров - https://products-store-v2.hexlet.app/
      2. Применить один или несколько фильтров (категория, производитель, наличие)
      3. Нажать «Сбросить фильтры»
      Ошибка возникает на шаге 2
    expected-result: |
      Все фильтры сброшены, отображается полный каталог
    actual-result: |
      Фильтр перестает работать, если выбрать более 1 фильтра, отображаются все товары на странице
      Нет кнопки «Сбросить фильтры»

  - summary: |
      Фильтр не сохраняется при возврате со страницы товара
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть каталог товаров - https://products-store-v2.hexlet.app/
      2. Применить фильтр
      3. Открыть страницу любого товара из отфильтрованного списка
      4. Вернуться в каталог кнопкой «Назад» в браузере
      Ошибка возникает на шаге 4
    expected-result: |
      Каталог отображается с ранее примененным фильтром
    actual-result: |
      Фильтр сброшен, отображается полный каталог, страница при этом сохраняется

  - summary: |
      Фильтр не сохраняется при возврате из корзины
    environment: |
      https://products-store-v2.hexlet.app/
      ОС: Windows 11, 26H2, сборка ОС 26300.9711
      Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    steps-to-reproduce: |
      1. Открыть каталог товаров - https://products-store-v2.hexlet.app/
      2. Применить фильтр
