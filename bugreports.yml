- summary: |
    Заказ не оформляется - POST /api/orders отвечает 500, страница оплаты не открывается
  environment: |
    Google Chrome 155.0.8059.80 (Официальная сборка) (64 бит)
    Firefox 159.0 (64-разрядный)
    ОС Windows 11, 26H2, сборка ОС 26300.9711
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/, выбрать русский язык
    2. Нажать «Следующая»
    3. В карточке Milk нажать «В корзину»
    4. Нажать «Корзина» в шапке
    5. Открыть DevTools (F12), вкладки Console
    6. Нажать «Оформить заказ»
  expected-result: |
    Заказ создаётся, открывается страница оплаты с суммой 3.01$
    В консоли нет ошибок, запросы не возвращают ответы 4xx и 5xx
  actual-result: |
    POST https://products-store.hexlet.app/api/orders ошибка 500 {"message":"Failed to create order","statusCode":500}, заказ не создаётся
    Страница оплаты не открывается, пользователь остаётся на https://products-store.hexlet.app/cart, товар остаётся в корзине
    Chrome — в консоли «Failed to load resource: the server responded with a status of 500»
    Firefox — в консоли красная строка POST /api/orders [HTTP/2 500]
    Консоль в Chrome — Screenshot/оформление заказа консоль_хром.png
    Консоль в Firefox — Screenshot/оформление заказа консоль_огненный лис.png
