- summary: |
    Не работает сброс примененных фильтров
  environment: |
    URL стенда: https://products-store-ru.hexlet.app/
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть каталог товаров - https://products-store-ru.hexlet.app/
    2. Применить один или несколько фильтров (категория, производитель, наличие)
    3. Нажать «Сбросить фильтры»
    Ошибка возникает на шаге 3
  expected-result: |
    Все фильтры сброшены, отображается полный каталог
  actual-result: |
    Нет кнопки «Сбросить фильтры»

- summary: |
    Фильтр не сохраняется при возврате со страницы товара
  environment: |
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть каталог товаров - https://products-store-ru.hexlet.app/
    2. Применить фильтр
    3. Открыть страницу любого товара из отфильтрованного списка
    4. Вернуться в каталог кнопкой «Назад» в браузере
    Ошибка возникает на шаге 4
  expected-result: |
    Каталог отображается с ранее примененным фильтром
  actual-result: |
    Фильтр сброшен, отображается полный каталог, страница при этом сохраняется

