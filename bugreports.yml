- summary: |
    Нет окна подтверждения при очистке корзины
  environment: |
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть каталог - https://products-store-ru.hexlet.app/
    2. Добавить в корзину один или несколько товаров
    3. Перейти в корзину
    4. Нажать «Очистить корзину»
