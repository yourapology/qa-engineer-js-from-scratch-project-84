---
- summary: |
    Не удаётся оформить заказ
  environment: |
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть главную страницу сайта - https://products-store-ru.hexlet.app/
    2. Добавить любой товар в корзину
    3. Перейти в корзину
    4. Нажать «Оформить заказ»
    Ошибка возникает на шаге 4
  expected-result: |
    Заказ создан, отображается страница подтверждения с номером заказа, корзина очищена
  actual-result: |
    Заказ создан, отображается уведомление "Заказ успешно оформлен"
    В консоли ошибка: POST 500 Internal Server Error
    Корзина не очищена
    
- summary: |
    Некорректная локализация интерфейса на русском языке
  environment: |
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть главную страницу сайта - https://products-store-ru.hexlet.app/
    2. Переключить язык интерфейса на русский
    3. Последовательно открыть каталог, страницу товара, корзину, оформление заказа
    4. Проверить тексты элементов интерфейса
    5. Проверить тексты в карточке товара
    6. Проверить тексты на странице товара
    Ошибка обнаруживается на шаге 5
  expected-result: |
    Все элементы интерфейса переведены на русский язык, тексты корректны и не обрезаются
  actual-result: |
    В карточке товара не переведено описание
    На странице товара описание не переведено 

- summary: |
    Время загрузки сайта на мобильном интернете превышает допустимое
  environment: |
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
    Сеть: эмуляция мобильный интернет 3G
  steps-to-reproduce: |
    1. Включить в DevTool, во вкладке Network эмуляцию сети 3G
    2. Очистить кэш браузера
    3. Открыть главную страницу сайта - https://products-store-ru.hexlet.app/
    4. Замерить время до полной загрузки страницы
    Ошибка обнаруживается на шаге 4
  expected-result: |
    Страница полностью загружается не более чем за 3 секунды
  actual-result: |
    Страница загружается за 4,71 секунд

- summary: |
    Низкая оценка производительности в Lighthouse
  environment: |
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит), Lighthouse 13.4.1
    Устройство: Mobile
  steps-to-reproduce: |
    1. Открыть главную страницу сайта в Chrome в режиме инкогнито
    2. Открыть DevTools - вкладка Lighthouse
    3. Выбрать категорию Performance и устройство
    4. Нажать «Analyze page load»
    5. Дождаться формирования отчёта
    Ошибка обнаруживается на шаге 5
  expected-result: |
    Оценка Performance не ниже 90
  actual-result: |
    Оценка Performance - 70. Проблемные метрики: First Contentful Paint - 3.6s

