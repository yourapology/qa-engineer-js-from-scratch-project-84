- summary: |
    Поиск не находит товары по всему каталогу
  environment: |
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть каталог товаров - https://products-store-ru.hexlet.app/
    2. Перейти на любую страницу, кроме первой, и запомнить название товара
    3. Вернуться на первую страницу каталога
    4. Ввести название этого товара в строку поиска
    Ошибка обнаруживается на шаге 4
  expected-result: |
    Товар отображается в результатах поиска независимо от того, на какой странице каталога он находится
  actual-result: |
    Товар не найден: поиск работает только по текущей странице

- summary: |
    Нет уведомления при добавлении товара в корзину из каталога
  environment: |
    ОС: Windows 11, 26H2, сборка ОС 26300.9711
    Браузер: Chrome 155.0.8059.80 (официальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть каталог товаров - https://products-store-ru.hexlet.app/
    2. Нажать «В корзину» у любого товара
    Ошибка возникает на шаге 2
  expected-result: |
    Отображается уведомление о добавлении товара в корзину
  actual-result: |
    Уведомление не появляется, товар при этом добавляется, счетчик в шапке у Корзины обновляется

